name: Build Windows update

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r source/requirements-build.txt
      - name: Verify updater integrity and recovery
        run: python source/test_updater.py
      - name: Acquire ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile ffmpeg.zip
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath ffmpeg-build
          $ffmpegDirectory = (Get-ChildItem -LiteralPath ffmpeg-build -Recurse -Filter ffmpeg.exe | Select-Object -First 1).Directory.FullName
          "X3_FFMPEG_DIRECTORY=$ffmpegDirectory" >> $env:GITHUB_ENV
      - name: Set release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $releaseVersion = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          $releaseVersion = $releaseVersion.TrimStart('v')
          "X3_RELEASE_VERSION=$releaseVersion" >> $env:GITHUB_ENV
      - name: Build and package
        shell: pwsh
        run: |
          python source/build.py --output package --version "$env:X3_RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" --ffmpeg "$env:X3_FFMPEG_DIRECTORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/release.py --build "package/dist/X3-Wwise响度与增益管理器" --output release-assets --version "$env:X3_RELEASE_VERSION" --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:X3_RELEASE_VERSION" --target "$env:GITHUB_SHA" --draft --title "X3-Wwise v$env:X3_RELEASE_VERSION" --generate-notes --repo "$env:GITHUB_REPOSITORY" release-assets/*.zip release-assets/update.json
